<html lang="en">
<head>

<script>(function(){try{var p=localStorage.getItem("fwtheme")||"auto";var d=p==="dark"||(p==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");}catch(e){}})();</script>
<style>
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));--sal:var(--safe-area-inset-left,env(safe-area-inset-left,0px));--sar:var(--safe-area-inset-right,env(safe-area-inset-right,0px));--bg:#f4f7fb;--card:#fff;--ink:#16202e;--mute:#5b6a7d;--line:#dde4ee;--field:#f6f8fb;--onbg:#e8effe;--okbg:#e3f6ec;--riskbg:#fdf0d4;--blockbg:#fde3e3;--infobg:#e8effe;--attr:rgba(255,255,255,.85);--mapbg:#e8edf3;--g:#1e8449;--rd:#c0392b;--am:#b9770e;--gr:#7a8798;color-scheme:light}
:root[data-theme="dark"]{--bg:#0e1520;--card:#17212f;--ink:#e8eef6;--mute:#9bacc1;--line:#2c3a4e;--field:#1e2a3b;--onbg:#1d3558;--okbg:#14382a;--riskbg:#44360f;--blockbg:#4a1d1f;--infobg:#1b2f52;--attr:rgba(23,33,47,.85);--mapbg:#0e1520;--g:#4cc38a;--rd:#ff7b72;--am:#f0b429;--gr:#9bacc1;color-scheme:dark}
.leaflet-container{background:var(--mapbg)}
.leaflet-bottom{padding-bottom:var(--sab)}.leaflet-right{padding-right:var(--sar)}.leaflet-left{padding-left:var(--sal)}
html,body{overscroll-behavior:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--ink)}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--card);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-control-attribution{background:var(--attr)!important;color:var(--mute)!important}.leaflet-control-attribution a{color:#3b82f6!important}
.darktiles .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#map{position:absolute;inset:0}
.top{position:absolute;z-index:1000;top:calc(10px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));max-width:470px;background:var(--card);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.2);padding:10px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--field);color:var(--ink)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.go{padding:0 16px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:600}
.ic{width:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:1.1rem}
.sheet{position:absolute;z-index:1000;left:calc(10px + var(--sal));right:calc(10px + var(--sar));bottom:calc(10px + var(--sab));max-width:470px;background:var(--card);border-radius:18px;box-shadow:0 4px 18px rgba(0,0,0,.25);padding:12px}
.msg{padding:9px 11px;border-radius:12px;font-size:.88rem;margin-top:8px}
.ok{background:var(--okbg)}.risk{background:var(--riskbg)}.block{background:var(--blockbg)}.info{background:var(--infobg)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.opt{padding:10px 4px;border:2px solid var(--line);background:var(--field);border-radius:12px;font-size:.8rem}
.opt b{display:block;font-size:1.25rem}.opt.on{border-color:#2563eb;background:var(--onbg)}
.small{font-size:.78rem;color:var(--mute)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mute);margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.top{overflow:auto;max-height:62vh}
.rl{display:grid;gap:6px;margin-top:6px}.rc{display:block;width:100%;text-align:left;padding:9px 10px;border:2px solid var(--line);background:var(--field);border-radius:12px;font-size:.82rem;line-height:1.4}.rc.on{border-color:#2563eb;background:var(--onbg)}
.me{width:26px;height:26px}.me .rot{position:relative;width:26px;height:26px}.me i{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 3px rgba(37,99,235,.28)}
.me b{display:none;position:absolute;left:6px;top:-9px;border:7px solid transparent;border-bottom:13px solid #2563eb;filter:drop-shadow(0 0 2px #fff)}.navmode .me b{display:block}
.navb{position:absolute;z-index:1000;top:calc(10px + var(--sat));left:calc(10px + var(--sal));right:calc(10px + var(--sar));max-width:470px;background:#16202e;color:#fff;border-radius:16px;padding:12px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.arow{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:6px;font-size:.85rem}.arow .nb{padding:6px 9px;font-size:.78rem}
#acm{position:fixed;inset:0;z-index:2000;background:var(--bg);overflow:auto}
.sp{max-width:540px;margin:0 auto;padding:0 calc(14px + var(--sar)) calc(40px + var(--sab)) calc(14px + var(--sal))}
.sph{display:flex;align-items:center;gap:10px;padding:12px 0;padding-top:max(12px,var(--sat));position:sticky;top:0;background:var(--bg);z-index:2}
.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;display:grid;gap:8px}
.stabs{display:flex;gap:6px;margin-top:4px}.stabs button{flex:1;padding:10px 4px;border:2px solid var(--line);background:var(--field);border-radius:12px;font-size:.82rem}.stabs button.on{border-color:#2563eb;background:var(--onbg)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat div{background:var(--field);border-radius:12px;padding:10px;text-align:center;font-size:.8rem}.stat b{display:block;font-size:1.4rem}
#sug{display:none;margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sg{display:block;width:100%;text-align:left;padding:9px 11px;border:0;border-bottom:1px solid var(--line);background:var(--card);font-size:.85rem;line-height:1.35}.sg:last-child{border-bottom:0}
select{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:inherit}
.mc{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:380px;display:grid;gap:8px;max-height:90vh;overflow:auto}
.call{display:block;padding:13px;border-radius:12px;background:#e04545;color:#fff;text-align:center;font-weight:600;text-decoration:none}
.nb{padding:12px;border:2px solid var(--line);background:var(--field);border-radius:12px;font-size:.92rem}
.pois{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.pois button{padding:5px 9px;border:1px solid var(--line);background:var(--field);border-radius:16px;font-size:.76rem}.pois button.on{border-color:#2563eb;background:var(--onbg)}
.poi span{display:flex;width:30px;height:30px;align-items:center;justify-content:center;background:var(--card);border:2px solid var(--mute);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.3);font-size:16px}.poi span.em{border-color:#e04545}
.pv{display:flex;gap:6px;margin-top:8px}.pv button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--field);border-radius:10px;font-size:.78rem}
.chips{display:flex;gap:6px;margin-top:8px}.chips button{flex:1;padding:8px 2px;border:2px solid var(--line);background:var(--field);border-radius:12px;font-size:.78rem}.chips button.on{border-color:#2563eb;background:var(--onbg)}
.tl{display:flex;align-items:center;gap:6px;font-size:.82rem;margin-top:8px}.tl input{flex:none;padding:0;width:auto}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="row">
    <input id="q" placeholder="Where to? (e.g. SM Mall of Asia)" aria-label="Destination">
    <button class="go" id="go">Go</button>
    <button class="ic" id="loc" title="My location" aria-label="Go to my location">📍</button>
    <button class="ic" id="acc" title="Settings" aria-label="Settings">⚙️</button>
    <button class="ic" id="sos" title="Emergency help" aria-label="Emergency help" style="border-color:#e04545">🆘</button>
    <button class="ic" id="clr" title="Clear route" aria-label="Clear route" style="display:none">✕</button>
  </div>
  <div id="sug"></div>
  <div class="chips"><button data-v="moto">🏍️ Motorcycle</button><button data-v="car">🚗 Car</button><button data-v="puv">🚌 Jeepney / Bus</button></div>
  <label class="tl"><input type="checkbox" id="toll"> Avoid toll roads</label>
  <div class="small" style="margin-top:8px">Show on map:</div><div class="pois" id="pois" style="margin-top:4px"></div><div class="small" id="pnote"></div>
  <div class="pois" id="trfrow" style="margin-top:6px"><button id="thm">🌗 Auto</button><button id="aut" style="display:none">📡 Auto-detect</button><button id="sat">🛰️ Satellite</button><button id="trf" style="display:none">🚦 Live traffic</button></div>
  <div id="res"></div>
  <div class="leg"><span><i style="background:#1fa463"></i>Passable</span><span><i style="background:#f0a020"></i>Risky</span><span><i style="background:#e04545"></i>Not passable</span><span>┄ Dashed = unverified</span><span id="sync"></span></div>
  <div id="wxb"></div><div id="svc"></div>
</div>
<div class="navb" id="nav" style="display:none">
  <div class="row" style="align-items:center"><div id="navi" style="font-size:2.4rem;line-height:1">⬆️</div>
    <div style="flex:1;min-width:0"><div id="navd" style="font-size:1.5rem;font-weight:700">—</div><div id="navt" style="font-size:.95rem"></div></div></div>
  <div id="nave" class="small" style="color:#b8c4d6;margin-top:6px"></div><div id="nava"></div>
  <div class="row" style="margin-top:8px"><button class="nb" id="navm" style="flex:1">🔊 Voice on</button><button class="nb" id="navr" style="flex:1">🌊 Report</button><button class="nb" id="navc" style="display:none">🎯</button><button class="nb" id="navx" style="flex:1;color:#e04545">End</button></div>
</div>
<div class="sheet" id="sheet"></div>
<div id="acm" style="display:none"><div class="sp"><div class="sph"><button class="nb" id="acx" style="padding:8px 14px">← Back</button><b style="font-size:1.15rem">⚙️ Settings</b></div><div id="acb"></div></div></div>
<div id="adm" style="display:none;position:fixed;inset:0;z-index:2050;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:16px">
  <div class="mc" style="max-width:480px"><b style="font-size:1.05rem">🛡️ Admin – reports (last 24 h)</b>
    <div class="small">Flagged reports are listed first. Reports with 3 or more flags are hidden from the public map until you review them.</div>
    <div id="adl"></div><button class="nb" id="adx">Close</button></div>
</div>
<div id="phm" style="display:none;position:fixed;inset:0;z-index:2100;background:rgba(0,0,0,.8);align-items:center;justify-content:center;padding:16px;flex-direction:column;gap:10px">
  <img id="phi" alt="Flood report photo" style="max-width:100%;max-height:75vh;border-radius:12px"><div id="phn" style="color:#fff"></div>
  <button class="nb" id="phx">Close</button>
</div>
<div id="sosm" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);align-items:center;justify-content:center;padding:16px">
  <div class="mc" role="dialog" aria-label="Emergency help">
    <b style="font-size:1.05rem">🆘 Emergency help</b>
    <div id="hot" style="display:grid;gap:8px"></div>
    <div class="small">Or get directions to the nearest:</div>
    <button class="nb" data-n="hospital">🏥 Hospital</button><button class="nb" data-n="police">🚓 Police station</button><button class="nb" data-n="fire">🚒 Fire station</button>
    <button class="nb" id="sosx" style="background:var(--card)">Close</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
// ---- SETTINGS ----
// For LIVE sharing between users: paste your Firebase Realtime Database URL, e.g. "https://my-app-default-rtdb.firebaseio.com"
const DB = ""; // (old setting, no longer used – Firebase below replaces it)
// Shared reports + sign-in + admin: create a free Firebase project and paste its web-app config here (see FIREBASE-SETUP.md).
// Leave apiKey empty to run in "this device only" mode.
const FB_VAPID = ""; // Web push key: Firebase console > Project settings > Cloud Messaging > Web Push certificates (only for alerts on the website)
const FB_CONFIG = { messagingSenderId:"", apiKey:"AIzaSyDM_0D3_5WMLWBRiXxap7j2_6FsjHuS5Ug", authDomain:"floodwatch-v1.firebaseapp.com", databaseURL:"https://floodwatch-v1-default-rtdb.asia-southeast1.firebasedatabase.app", projectId:"floodwatch-v1", appId:"1:523645522276:web:f49354d12dd3bc0df6ea71" };
const FB_ON = !!FB_CONFIG.apiKey && typeof firebase !== "undefined";
// true when running inside the Android app (Capacitor), false on the website
const IS_APP = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// For real toll avoidance + precise flood avoidance: get a FREE key at https://openrouteservice.org (Sign up > Dashboard > Request a token)
// and paste it here. Leave empty to use the basic free router.
const ORS_KEY = "";
// TomTom (recommended): live-traffic routing, motorcycle mode, toll + flood-zone avoidance, search and traffic map.
// Free key at https://developer.tomtom.com (Sign up > Dashboard > Keys). Paste it here:
const TOMTOM_KEY = "bT1Tg9UK2DxHbFQ4L89RYp9vL8tcy2Ze";
// Optional extra map: MapTiler has a free plan. Get a key at https://www.maptiler.com (Cloud > API keys) and paste it here.
const MAPTILER_KEY = "2Y1z2gjWKTUO76Rljhkg";
const TT_MODE = {moto:"motorcycle", car:"car", puv:"bus"};
let engine = "";
const PROFILE = {moto:"driving-car", car:"driving-car", puv:"driving-car"}; // OpenRouteService has no motorcycle profile
const EXPIRE_HOURS = 3, NEAR_M = 80, COOLDOWN_S = 20, CLEAR_HIDE_S = 60;
const COL = {ok:"#1fa463", risk:"#f0a020", block:"#e04545"};
const LBL = {ok:"Passable", risk:"Risky", block:"Not passable"};
const DEPTH = ["Ankle-deep","Knee-deep","Waist-deep+"];
const $ = id => document.getElementById(id);

const map = L.map("map",{zoomControl:false}).setView([14.4793,121.0198],14);
L.control.zoom({position:"bottomright"}).addTo(map);
// Hosted on a website: official OpenStreetMap tiles. Opened as a local file: Esri tiles (OSM blocks file:// pages).
if(TOMTOM_KEY)
  L.tileLayer("https://api.tomtom.com/map/1/tile/basic/main/{z}/{x}/{y}.png?key="+TOMTOM_KEY,{maxZoom:22,attribution:"© TomTom, © OpenStreetMap contributors"}).addTo(map);
else if(location.protocol==="http:"||location.protocol==="https:")
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
else
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"}).addTo(map);

const VEH={moto:"🏍️ motorcycles",car:"🚗 cars",puv:"🚌 jeepneys & buses"};
const RANK={ok:0,risk:1,block:2};
// How each vehicle copes with water depth (ankle / knee / waist+), and how we adjust "light vehicle" reports for it
const DR={moto:["ok","block","block"],car:["ok","risk","block"],puv:["ok","ok","block"]};
const SH={moto:{ok:"ok",risk:"risk",block:"block"},car:{ok:"ok",risk:"risk",block:"block"},puv:{ok:"ok",risk:"ok",block:"risk"}};
const eff=(r,v)=>{const a=SH[v][r.s],b=DR[v][r.d];return RANK[a]>=RANK[b]?a:b};
let vehicle="car", avoidToll=false, tollBroken=false;
try{const v=JSON.parse(localStorage.getItem("fwv")||"{}"); if(VEH[v.vehicle]) vehicle=v.vehicle; avoidToll=!!v.avoidToll;}catch(e){}
const st=r=>eff(r,vehicle);
let user=null, isAdmin=false, banned=false, flags={}, fbdb=null, fbauth=null, autoReports=[];
let me=null, meMarker=null, dest=null, destMarker=null, reports=[], pick="ok", depth=0, pending=null, pendMarker=null, lastSent=0;
const layer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
$("sync").textContent = (FB_ON ? "🟢 Live sync on" : "⚪ Reports saved on this device only") + (TOMTOM_KEY ? " · 🚦 TomTom routing + traffic on" : ORS_KEY ? " · 🧭 Smart routing on" : "");

// ---- storage / sync ----
const valid = r => { if(!(r && COL[r.s] && DEPTH[r.d] && isFinite(r.lat) && isFinite(r.lng) && isFinite(r.t))) return false; if(r.id!==undefined && !/^[a-z0-9]{6,24}$/.test(String(r.id))) return false; r.v=(r.v===1||r.v===2)?r.v:0; r.av=r.av===1?1:0; return true; };
if(!FB_ON) try { reports = JSON.parse(localStorage.getItem("fwl")||"[]").filter(valid).filter(r=>Date.now()-r.t<24*3600e3); } catch(e){}
const saveLocal = () => { try{ localStorage.setItem("fwl", JSON.stringify(reports)); }catch(e){} };
async function pull(){
  if(!DB) return;
  try{ const o = await (await fetch(DB+"/reports.json")).json(); reports = Object.values(o||{}).filter(valid); saveLocal(); render(); }catch(e){}
}
async function push(r){ if(DB) try{ await fetch(DB+"/reports.json",{method:"POST",body:JSON.stringify(r)}); }catch(e){} }
const live = () => reports.concat(autoReports).filter(r => Date.now()-r.t < EXPIRE_HOURS*3600e3);
// newest report within ~NEAR_M of each other wins (so "cleared" overrides older "blocked")
const flagN=r=>{ const f=r.id&&flags[r.id]; return f?Object.keys(f).length:0; };
const trust=r=>r.av?3:(r.v||0);
const disputed=r=>!r.av&&flagN(r)>=3&&(r.v||0)<2;   // hidden until an admin reviews it
function current(){
  const all=live().filter(r=>!disputed(r)).sort((a,b)=>b.t-a.t), out=[];
  all.forEach(r=>{
    r.cleared=false;
    if(out.some(o=>hav([o.lat,o.lng],[r.lat,r.lng])<NEAR_M)) return;
    if(r.s==="ok"){
      // a "passable/cleared" report only replaces a flood report if it is at least as well verified
      if(all.some(x=>x.s!=="ok" && trust(x)>trust(r) && hav([x.lat,x.lng],[r.lat,r.lng])<NEAR_M)) return;
      // a "cleared" report (it replaced an older flood report) is shown for CLEAR_HIDE_S seconds, then leaves the map
      r.cleared=all.some(x=>x.s!=="ok" && x.t<r.t && hav([x.lat,x.lng],[r.lat,r.lng])<NEAR_M);
    }
    out.push(r);
  });
  return out;
}
const ago = t => { const m=Math.round((Date.now()-t)/60000); return m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago"; };

// ---- draw reports ----
function render(){
  layer.clearLayers();
  current().filter(r=>!(r.cleared&&Date.now()-r.t>CLEAR_HIDE_S*1000)).forEach(r => {
    const tools=r.auto
      ? `<div class="small">${esc(r.desc||"Flooding reported by traffic data")}${r.from?" · "+esc(r.from):""}</div>`
      : `<div class="pv"><button onclick="vote(${r.t},'${r.s}')">👍 Still true</button><button onclick="vote(${r.t},'ok')">✅ It’s cleared</button>${r.id?`<button onclick="flagReport('${r.id}')">🚩 Flag</button>`:""}</div>`;
    const pop=`<b>${LBL[st(r)]}</b> for ${VEH[vehicle]}<br>${r.auto?"Depth unknown":DEPTH[r.d]} · ${ago(r.t)}<br>${badge(r)}${r.ph&&r.id?`<div class="pv"><button onclick="showPhoto('${r.id}')">📷 View photo</button></div>`:""}${tools}`;
    L.circle([r.lat,r.lng],{radius:NEAR_M*0.7,color:COL[st(r)],fillColor:COL[st(r)],fillOpacity:.35,weight:(r.v===2?4:2),dashArray:(r.auto?"2 7":(r.v>=1?null:"5 5"))}).bindPopup(pop).addTo(layer);
    if(r.auto) L.marker([r.lat,r.lng],{icon:L.divIcon({className:"poi",html:"<span>📡</span>",iconSize:[30,30],iconAnchor:[15,15]}),zIndexOffset:400}).bindPopup(pop).addTo(layer);
  });
}
window.vote = async (id,s) => {
  const o = reports.find(r=>r.t===id); if(!o||!cool()||!gate()) return;
  map.closePopup(); addReport(await makeReport(o.lat,o.lng,s,s==="ok"?0:o.d,null));
};
const cool = () => { if(isAdmin) return true; const w = COOLDOWN_S-(Date.now()-lastSent)/1000; if(w>0){ say(`Please wait ${Math.ceil(w)}s before sending another report.`,"risk"); return false; } return true; };
async function addReport(r){
  reports.push(r); render();
  if(FB_ON){

function hav(a,b){ const R=6371e3,k=Math.PI/180,dA=(b[0]-a[0])*k,dO=(b[1]-a[1])*k,x=Math.sin(dA/2)**2+Math.cos(a[0]*k)*Math.cos(b[0]*k)*Math.sin(dO/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

const sq=r=>{ const dl=100/111000, dn=100/(111000*Math.cos(r.lat*Math.PI/180)); return [[[r.lng-dn,r.lat-dl],[r.lng+dn,r.lat-dl],[r.lng+dn,r.lat+dl],[r.lng-dn,r.lat+dl],[r.lng-dn,r.lat-dl]]]; };
async function ors(pts,alt,polys){
  const body={coordinates:pts.map(p=>[p[1],p[0]]),options:{}};
  if(avoidToll) body.options.avoid_features=["tollways"];
  if(polys&&polys.length) body.options.avoid_polygons={type:"MultiPolygon",coordinates:polys};
  if(alt) body.alternative_routes={target_count:3,share_factor:0.6,weight_factor:1.6};
  const res=await fetch("https://api.openrouteservice.org/v2/directions/"+PROFILE[vehicle]+"/geojson",{method:"POST",headers:{"Content-Type":"application/json","Authorization":ORS_KEY},body:JSON.stringify(body)});
  const j=await res.json(); if(!j.features||!j.features.length) throw new Error("ors");

    steps:(f.properties.segments||[]).flatMap(sg=>(sg.steps||[]).map(t=>{ const c=f.geometry.coordinates[t.way_points[0]]; return {text:t.instruction,dist:t.distance,loc:[c[1],c[0]]}; }))}));
}
async function tt(pts,alt,polys){
  const loc=pts.map(p=>p[0]+","+p[1]).join(":");
  const q=new URLSearchParams({key:TOMTOM_KEY,instructionsType:"text",language:"en-GB",traffic:"true",travelMode:TT_MODE[vehicle],routeRepresentation:"polyline",computeTravelTimeFor:"all"});
  if(alt) q.set("maxAlternatives","3");
  if(avoidToll) q.append("avoid","tollRoads");
  const url="https://api.tomtom.com/routing/1/calculateRoute/"+loc+"/json?"+q.toString();
  let res;
  if(polys&&polys.length){
    const rectangles=polys.slice(0,10).map(pg=>{ const r=pg[0], lo=r.map(c=>c[0]), la=r.map(c=>c[1]);
      return {southWestCorner:{latitude:Math.min.apply(null,la),longitude:Math.min.apply(null,lo)},northEastCorner:{latitude:Math.max.apply(null,la),longitude:Math.max.apply(null,lo)}}; });
    res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({avoidAreas:{rectangles:rectangles}})});
  } else res=await fetch(url);
  const j=await res.json(); if(!j.routes||!j.routes.length) throw new Error("tt");
  return j.routes.map(r=>{

    const ins=(r.guidance&&r.guidance.instructions)||[], total=r.summary.lengthInMeters;
    const steps=ins.map((x,i)=>({text:x.message||"Continue",dist:(i<ins.length-1?ins[i+1].routeOffsetInMeters:total)-x.routeOffsetInMeters,loc:[x.point.latitude,x.point.longitude]}));
    return {geometry:{type:"LineString",coordinates:co},distance:total,duration:r.summary.travelTimeInSeconds,delay:r.summary.trafficDelayInSeconds||0,steps:steps};
  });

async function route(pts,alt,polys){
  if(TOMTOM_KEY){
    try{ const r=await tt(pts,alt,polys); engine="TomTom"; return r; }catch(e){}
    if(alt){ try{ const r=await tt(pts,false,polys); engine="TomTom"; return r; }catch(e){} }
  }
  if(ORS_KEY){
    try{ const r=await ors(pts,alt,polys); engine="OpenRouteService"; return r; }catch(e){}
    if(alt){ try{ const r=await ors(pts,false,polys); engine="OpenRouteService"; return r; }catch(e){} }
  }

function osrmText(s){ const m=s.maneuver, d=m.modifier||"", on=s.name?" onto "+s.name:"";
  if(m.type==="arrive") return "You have arrived";
  if(m.type==="depart") return "Head out"+(s.name?" on "+s.name:"");
  if(m.type==="roundabout"||m.type==="rotary") return "Enter the roundabout"+(s.name?" and exit onto "+s.name:"");
  if(m.type==="continue"||m.type==="new name") return "Continue"+(s.name?" on "+s.name:"");
  if(m.type==="merge") return "Merge"+on;
  if(m.type==="fork") return "Keep "+(d.indexOf("left")>=0?"left":"right")+" at the fork"+on;
  if(d==="uturn") return "Make a U-turn";
  if(d==="straight") return "Continue straight"+on;
  return (m.type==="end of road"?"At the end of the road, turn ":"Turn ")+d+on; }
function addSteps(r){ const out=[], L2=(r.legs||[]).length;
  (r.legs||[]).forEach((lg,li)=>(lg.steps||[]).forEach(s=>{ const m=s.maneuver;
    if(m.type==="arrive"&&li<L2-1) return; if(m.type==="depart"&&li>0) return;
    out.push({text:osrmText(s),dist:s.distance,loc:[m.location[1],m.location[0]]}); }));
  return Object.assign({},r,{steps:out}); }
async function osrm(pts,alt){
  const u=`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p[1]+","+p[0]).join(";")}?alternatives=${alt?3:false}&overview=full&geometries=geojson&steps=true`;
  if(avoidToll&&!tollBroken){ try{ const t=await (await fetch(u+"&exclude=toll")).json(); if(t.code==="Ok") return t.routes.map(addSteps); }catch(e){} tollBroken=true; }

async function routeTo(d,auto){
  routeLayer.clearLayers(); $("clr").style.display="block";
  const c=map.getCenter(), start=me||[c.lat,c.lng];
  try{
    say("Finding the safest route…","info");
    let cand=(await route([start,d],true)).map(score);
    if(!cand.length){ say("No road route found.","risk"); return; }
    const fastest=cand[0], rank=(a,b)=>a.block-b.block||a.risk-b.risk||a.rt.duration-b.rt.duration;
    let best=[...cand].sort(rank)[0], detour=false;
    // still flooded? try detours that swing around the blocking spot
    const blocker=best.hits.find(r=>st(r)==="block")||best.hits[0];
    if(blocker&&best.block+best.risk>0){
      const dl=900/111000, dn=900/(111000*Math.cos(blocker.lat*Math.PI/180));
      const vias=[[blocker.lat+dl,blocker.lng],[blocker.lat-dl,blocker.lng],[blocker.lat,blocker.lng+dn],[blocker.lat,blocker.lng-dn]];
      const extra=ORS_KEY ? (await route([start,d],false,best.hits.map(sq)).catch(()=>[])).map(score) : (await Promise.all(vias.map(v=>route([start,v,d],false).catch(()=>[])))).flat().map(score);
      const b2=[...cand,...extra].sort(rank)[0];
      if(rank(b2,best)<0){ best=b2; detour=true; }
      extra.forEach(x=>x.extra=true); cand=[...cand,...extra];
    }
    const dur=(x,y)=>x.rt.duration-y.rt.duration;
    const uniq=[]; cand.forEach(x=>{ if(!uniq.some(u=>Math.abs(u.rt.distance-x.rt.distance)<80&&Math.abs(u.rt.duration-x.rt.duration)<40)) uniq.push(x); });
    const choices=uniq.sort(rank).slice(0,5);
    const fastestC=[...choices].sort(dur)[0], shortestC=[...choices].sort((x,y)=>x.rt.distance-y.rt.distance)[0];
    const tags=x=>[x===choices[0]?"⭐ Recommended":"",x===fastestC?"⚡ Fastest":"",x===shortestC?"📏 Shortest":"",x.extra?"↪️ Detour":""].filter(Boolean).join(" · ")||"Alternative";
    const flag=x=>x.block?'<span style="color:var(--rd)">⛔ Flooded road</span>':x.risk?'<span style="color:var(--am)">⚠️ Risky spot</span>':'<span style="color:var(--g)">✅ Clear</span>';
    const show=(i,fit)=>{
      routeLayer.clearLayers(); const sel=choices[i];
      choices.forEach((x,j)=>{ if(j!==i) L.geoJSON(x.rt.geometry,{style:{color:"#7a8798",weight:6,opacity:.7,dashArray:"2 9"}}).on("click",()=>show(j)).addTo(routeLayer); });
      const line=L.geoJSON(sel.rt.geometry,{style:{color:sel.block?COL.block:sel.risk?COL.risk:"#2563eb",weight:7,opacity:.95}}).addTo(routeLayer);
      if(fit) map.fitBounds(line.getBounds(),{padding:[70,70]});
      const km=(sel.rt.distance/1000).toFixed(1), min=Math.round(sel.rt.duration/60); let h,c;
      if(sel.block){ c="block"; h=`<b>⛔ This route passes a flooded road.</b><br>${km} km · ${min} min.${choices.every(x=>x.block)?" Every route we found is affected. Consider waiting.":""}`; }
      else if(sel.risk){ c="risk"; h=`<b>⚠️ This route has a risky flooded spot</b><br>${km} km · ${min} min. Drive slowly.`; }
      else if(fastestC!==sel&&(fastestC.block||fastestC.risk)){ c="ok"; h=`<b>✅ Safer route</b><br>${km} km · ${min} min. The fastest route has ${fastestC.block?"a road that’s not passable":"a risky flooded road"}.`; }
      else { c="ok"; h=`<b>✅ Route looks clear</b><br>${km} km · ${min} min.${me?"":" (Starting from the map center.)"}`; }
      const cards=choices.map((x,j)=>`<button class="rc ${j===i?"on":""}" data-i="${j}"><b>${tags(x)}</b><br>${(x.rt.distance/1000).toFixed(1)} km · ${Math.round(x.rt.duration/60)} min${x.rt.delay>=120?" (+"+Math.round(x.rt.delay/60)+" min traffic)":""} · ${flag(x)}</button>`).join("");
      $("res").innerHTML=`<div class="msg ${c}">${h}</div><button class="go" id="startnav" style="width:100%;padding:11px;margin-top:8px">${sel.block?"▶ Start anyway (flooded road)":"▶ Start navigation"}</button><button class="nb" id="simnav" style="width:100%;margin-top:6px;font-size:.82rem">🎬 Try a demo drive (no GPS needed)</button><div class="small" style="margin-top:8px">${choices.length} route${choices.length>1?"s":""} found via ${engine}. Tap one to compare:</div><div class="rl">${cards}</div>`

    const lvl=peak>=30?3:peak>=15?2:peak>=7.5?1:0;
    if(lvl){ const nm=["","Heavy rain","Intense rain","Torrential rain"][lvl];
      html+='<div class="msg '+(lvl===1?"risk":"block")+'">🌧️ <b>'+nm+' near you</b> (about '+Math.round(peak)+' mm in an hour). Low-lying roads may flood. '+(lvl>=2?"Avoid underpasses and rivers.":"Drive carefully.")+'</div>';
      if(lvl>=2&&lvl>wxLevelSent){ wxLevelSent=lvl; notify("🌧️ "+nm+" near you","About "+Math.round(peak)+" mm in an hour. Expect flooding in low areas.","rain"+lvl); }
    } else wxLevelSent=0;
  }catch(e){}
  try{
    const f=await (await fetch("https://flood-api.open-meteo.com/v1/flood?latitude="+c.lat.toFixed(3)+"&longitude="+c.lng.toFixed(3)+"&daily=river_discharge&past_days=30&forecast_days=3")).json();
    const q=((f.daily&&f.daily.river_discharge)||[]).map(Number).filter(isFinite);
    if(q.length>=20){ const past=q.slice(0,q.length-4), base=past.reduce((a,x)=>a+x,0)/past.length, nxt=Math.max.apply(null,q.slice(-4));
      if(base>0&&nxt/base>=2) html+='<div class="msg info">🌊 River flow nearby is forecast at <b>'+(nxt/base).toFixed(1)+'×</b> its 30-day average (satellite model estimate, may miss small rivers and creeks).</div>'; }
  }catch(e){}
  if(wb) wb.innerHTML=html;
}
if(TOMTOM_KEY){
  $("aut").style.display=""; $("aut").classList.toggle("on",autoOn);
  $("aut").onclick=()=>{ autoOn=!autoOn; try{ localStorage.setItem("fwauto",autoOn?"1":"0"); }catch(e){} $("aut").classList.toggle("on",autoOn); pollAuto(); };
}
map.on("moveend",()=>{ clearTimeout(autoMoveTimer); autoMoveTimer=setTimeout(()=>{ const c=map.getCenter(); if(!lastAuto||hav([c.lat,c.lng],lastAuto)>6000) pollAuto(); },1500); });
setInterval(()=>{ pollAuto(); },5*60e3);
setInterval(()=>{ pollWx(); },15*60e3);
setTimeout(()=>{ pollAuto(); pollWx(); },2000);

// ---- alerts when the app is closed (push notifications through Firebase Cloud Messaging) ----
let pushToken=null, subPath=null, lastSubSync=0, lastSubPos=null;
const pushPlugin=()=>IS_APP&&window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.PushNotifications;
const tidOf=t=>String(t).replace(/[^A-Za-z0-9_-]/g,"_").slice(-40);
async function webPushOK(){
  try{ return !IS_APP&&!!FB_VAPID&&!!FB_CONFIG.messagingSenderId&&"serviceWorker" in navigator&&"PushManager" in window&&typeof firebase.messaging==="function"&&await firebase.messaging.isSupported(); }catch(e){ return false; }
}
function pushStatusText(){
  if(!FB_ON) return "Alerts when the app is closed need the shared database (Firebase).";
  if(!user) return "Sign in to also get alerts when the app is closed.";
  if(!user.emailVerified) return "Verify your email to get alerts when the app is closed.";
  if(pushToken&&subPath) return "📨 Alerts when the app is closed: ON for this device.";
  if(IS_APP&&!pushPlugin()) return "This app build doesn’t include closed-app alerts yet (see PUSH-SETUP.md).";
  if(!IS_APP&&!(FB_VAPID&&FB_CONFIG.messagingSenderId)) return "Closed-app alerts on the website need setup (see PUSH-SETUP.md).";
  return alertsOn?"Closed-app alerts aren’t active yet. Allow notifications and make sure location is on, then turn alerts off and on again.":"Turn alerts on to also get them when the app is closed.";
}
async function enablePush(){
  try{
    if(!FB_ON||!user||!user.emailVerified) return false;
    let token=null;
    if(IS_APP){
      const pn=pushPlugin(); if(!pn) return false;
      const p=await pn.requestPermissions(); if(!p||p.receive!=="granted") return false;
      try{ await pn.createChannel({id:"floods",name:"Flood alerts",description:"Flood reports and warnings near you",importance:5,visibility:1}); }catch(e){}
      token=await new Promise(res=>{ let hs=[], done=false;
        const fin=v=>{ if(done) return; done=true; hs.forEach(h=>{ try{ h.remove(); }catch(e){} }); res(v); };
        pn.addListener("registration",t=>fin(t&&t.value)).then(h=>hs.push(h)); pn.addListener("registrationError",()=>fin(null)).then(h=>hs.push(h));
        setTimeout(()=>fin(null),15000); pn.register().catch(()=>fin(null)); });
    } else {
      if(!(await webPushOK())) return false;
      const reg=await navigator.serviceWorker.getRegistration(); if(!reg) return false;
      if(Notification.permission!=="granted"&&(await Notification.requestPermission())!=="granted") return false;
      token=await firebase.messaging().getToken({vapidKey:FB_VAPID,serviceWorkerRegistration:reg});
    }
    if(!token) return false;
    pushToken=token; await syncSub(true);
    if($("acm").style.display==="block"&&setTab==="account") renderAccount();
    return !!subPath;
  }catch(e){ return false; }
}
// tells the server roughly where this phone is, so it knows whether a new report is nearby
async function syncSub(force){
  if(!FB_ON||!user||!user.emailVerified||!pushToken||!alertsOn||!me) return;
  const now=Date.now(); if(!force&&lastSubPos&&hav(lastSubPos,me)<1000&&now-lastSubSync<30*60e3) return;
  const path="subs/"+user.uid+"/"+tidOf(pushToken);
  try{ await fbdb.ref(path).update({token:pushToken,lat:+me[0].toFixed(3),lng:+me[1].toFixed(3),km:alertKm,p:IS_APP?"android":"web",t:firebase.database.ServerValue.TIMESTAMP});
    subPath=path; lastSubSync=now; lastSubPos=me.slice(); }catch(e){}
}
async function dropSub(){
  const path=subPath; subPath=null; lastSubPos=null;
  if(path&&FB_ON) try{ await fbdb.ref(path).remove(); }catch(e){}
}

// ---- service check (helps find out why the map or traffic does not load) ----
async function checkServices(){
  const out=$("chkres"); if(!out) return;
  if(!TOMTOM_KEY){ out.innerHTML='<div class="msg risk">No TomTom key is set in this app, so the backup map is used.</div>'; return; }
  out.innerHTML='<div class="small">Checking…</div>';
  const K=TOMTOM_KEY, inc="https://api.tomtom.com/traffic/services/5/incidentDetails?key="+K+"&bbox=120.95,14.45,121.05,14.55&fields="+encodeURIComponent("{incidents{type}}")+"&language=en-GB&timeValidityFilter=present";
  const T=[["Map tiles","https://api.tomtom.com/map/1/tile/basic/main/10/856/470.png?key="+K],
    ["Night map tiles","https://api.tomtom.com/map/1/tile/basic/night/10/856/470.png?key="+K],
    ["Live traffic tiles","https://api.tomtom.com/traffic/map/4/tile/flow/relative/10/856/470.png?key="+K],
    ["Place search","https://api.tomtom.com/search/2/search/manila.json?key="+K+"&limit=1"],
    ["Routing","https://api.tomtom.com/routing/1/calculateRoute/14.50,121.00:14.55,121.00/json?key="+K],
    ["Nearby places (TomTom)","https://api.tomtom.com/search/2/nearbySearch/.json?key="+K+"&lat=14.5&lon=121&radius=3000&limit=1&categorySet=7321"],
    ["Flood detection (traffic incidents)",inc],
    ["Rain forecast (Open-Meteo)","https://api.open-meteo.com/v1/forecast?latitude=14.5&longitude=121&current=precipitation"]];
  const why=c=>c===0?"couldn’t connect. You may be offline, or the key doesn’t allow this website.":(c===401||c===403)?"the key isn’t allowed for this service or website. Check ‘Allowed domains’ and the enabled products for the key in your TomTom dashboard.":c===429?"free limit reached for now.":c===404?"service not found.":"error "+c+".";
  const rows=await Promise.all(T.map(async t=>{
    try{ const r=await fetch(t[1]); let m=""; if(!r.ok){ try{ m=(await r.text()).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,120); }catch(e){} } return [t[0],r.ok,r.status,m]; }
    catch(e){ return [t[0],false,0,""]; } }));
  out.innerHTML='<div class="small">This page: <b>'+esc(location.origin)+'</b> (it must be in your key’s allowed domains)</div>'+
    rows.map(r=>'<div class="arow"><div>'+(r[1]?"✅":"❌")+" <b>"+esc(r[0])+"</b>"+(r[1]?"":'<br><span class="small">HTTP '+r[2]+': '+esc(why(r[2]))+(r[3]?" Message: "+esc(r[3]):"")+"</span>")+"</div></div>").join("");
}

// ---- emergency help ----
// Edit this list to add your city or barangay hotlines (please double-check numbers before launch)
const HOTLINES=[["National Emergency Hotline","911"],["Philippine Red Cross","143"]];
$("hot").innerHTML=HOTLINES.map(h=>`<a class="call" href="tel:${esc(h[1])}">📞 Call ${esc(h[1])} · ${esc(h[0])}</a>`).join("");
const sosm=$("sosm");
$("sos").onclick=()=>{ showLayer(sosm,"flex"); };
$("sosx").onclick=()=>{ hideLayer(sosm); };
sosm.addEventListener("click",e=>{ if(e.target===sosm) hideLayer(sosm); });
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>nearest(b.dataset.n));
async function nearest(kind){
  const c=map.getCenter(), o=me||[c.lat,c.lng];
  hideLayer(sosm); say(`Finding the nearest ${POI[kind].n.toLowerCase()}…`,"info");
  try{
    const dLat=0.09, dLng=0.09/Math.max(0.2,Math.cos(o[0]*Math.PI/180));
    const places=await fetchPlaces([kind],{lat:o[0],lng:o[1],rad:10000,s:o[0]-dLat,n:o[0]+dLat,w:o[1]-dLng,e:o[1]+dLng});
    let best=null, bd=Infinity;
    places.forEach(p=>{ poiCache[p.k]={k:p.k,kind:kind,lat:p.lat,lng:p.lng,name:p.name}; const d=hav(o,[p.lat,p.lng]); if(d<bd){ bd=d; best=p.k; } });
    if(!best){ say(`No ${POI[kind].n.toLowerCase()} found within 10 km in the map data. If it’s urgent, call 911.`,"risk"); return; }
    poiOn[kind]=1; poiChips(); goPoi(best);
  }catch(e){ say("Couldn’t search right now. If it’s urgent, call 911.","risk"); }
}
// ---- dark mode (Auto follows your phone's setting) ----
let themePref="auto"; try{ themePref=localStorage.getItem("fwtheme")||"auto"; }catch(e){}
const darkMQ=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
const isDark=()=>themePref==="dark"||(themePref==="auto"&&!!darkMQ&&darkMQ.matches);
let mapStyle="auto"; try{ mapStyle=localStorage.getItem("fwmap")||"auto"; }catch(e){}
let tileOk=0, tileErr=0, badStyle={}, curTileUrl="", curAttr="";
const STYLES={
  tomtom:dk=>({url:"https://api.tomtom.com/map/1/tile/basic/"+(dk?"night":"main")+"/{z}/{x}/{y}.png?key="+TOMTOM_KEY,attr:"© TomTom, © OpenStreetMap contributors",nz:22,filter:false}),
  maptiler:dk=>({url:"https://api.maptiler.com/maps/"+(dk?"streets-v2-dark":"streets-v2")+"/256/{z}/{x}/{y}.png?key="+MAPTILER_KEY,attr:"© MapTiler © OpenStreetMap contributors",nz:22,filter:false}),
  esri:dk=>({url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",attr:"Tiles © Esri",nz:19,filter:dk}),
  osm:dk=>({url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",attr:"© OpenStreetMap contributors",nz:19,filter:dk})
};
const styleOK=k=>!badStyle[k]&&(k==="esri"||k==="osm"||(k==="tomtom"&&!!TOMTOM_KEY)||(k==="maptiler"&&!!MAPTILER_KEY));
function effectiveStyle(){ return (mapStyle==="auto"?["tomtom","maptiler","esri"]:[mapStyle,"tomtom","maptiler","esri"]).find(styleOK)||"esri"; }
function svcMsg(t){ const e=$("svc"); if(e) e.innerHTML=t?'<div class="msg risk">'+t+'</div>':""; }
function syncTiles(){
  const dk=isDark(), cfg=STYLES[effectiveStyle()](dk);
  if(baseLayer&&cfg.url!==curTileUrl){
    tileOk=0; tileErr=0;
    const onMap=map.hasLayer(baseLayer);
    try{ if(onMap&&curAttr) map.attributionControl.removeAttribution(curAttr); }catch(e){}
    baseLayer.options.maxNativeZoom=cfg.nz; baseLayer.options.attribution=cfg.attr;
    try{ if(onMap) map.attributionControl.addAttribution(cfg.attr); }catch(e){}
    baseLayer.setUrl(cfg.url); curTileUrl=cfg.url; curAttr=cfg.attr;
  }
  $("map").classList.toggle("darktiles",!!cfg.filter&&!satOn);
}
function applyTheme(){
  const dk=isDark(); document.documentElement.setAttribute("data-theme",dk?"dark":"light");
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute("content",dk?"#0e1520":"#2563eb");
  $("thm").textContent=themePref==="auto"?"🌗 Auto":themePref==="dark"?"🌙 Dark":"☀️ Light";
  syncTiles();
}
$("thm").onclick=()=>{ themePref=themePref==="auto"?"dark":themePref==="dark"?"light":"auto"; try{ localStorage.setItem("fwtheme",themePref); }catch(e){} applyTheme(); };
if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener("change",applyTheme);

// ---- satellite view (Esri World Imagery + place labels) ----
let baseLayer=null; map.eachLayer(l=>{ if(l instanceof L.TileLayer) baseLayer=l; });
if(baseLayer) baseLayer.setZIndex(1);
if(baseLayer){
  curAttr=(baseLayer.options&&baseLayer.options.attribution)||"";
  baseLayer.on("tileload",()=>{ tileOk++; });
  baseLayer.on("tileerror",()=>{
    const st=effectiveStyle();
    if((st==="tomtom"||st==="maptiler")&&tileOk===0&&++tileErr>=3){
      badStyle[st]=true;
      svcMsg("⚠️ "+(st==="tomtom"?"TomTom":"MapTiler")+" map tiles aren’t loading, so a backup map is shown. Open ⚙️ Settings → Account → 🔧 Check map services to see why.");
      syncTiles();
    }
  });
}
const satLayer=L.layerGroup([
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:18,maxZoom:22,zIndex:1,attribution:"Imagery © Esri, Maxar, Earthstar Geographics"}),
  L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxNativeZoom:18,maxZoom:22,zIndex:2,opacity:.95})
]);
let satOn=false; try{ satOn=localStorage.getItem("fws")==="1"; }catch(e){}
function applySat(){
  if(baseLayer){ if(satOn) map.removeLayer(baseLayer); else if(!map.hasLayer(baseLayer)) baseLayer.addTo(map); }
  if(satOn) satLayer.addTo(map); else map.removeLayer(satLayer);
  $("sat").classList.toggle("on",satOn);
  try{ localStorage.setItem("fws",satOn?"1":"0"); }catch(e){}
  syncTiles();
}
$("sat").onclick=()=>{ satOn=!satOn; applySat(); };
applySat(); applyTheme();

// ---- live traffic layer (TomTom) ----
if(TOMTOM_KEY){
  $("trf").style.display="";
  const trafficLayer=L.tileLayer("https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key="+TOMTOM_KEY,{maxZoom:22,opacity:.8,zIndex:5});
  let on=false; try{ on=localStorage.getItem("fwt")==="1"; }catch(e){}
  const apply=()=>{ if(on) trafficLayer.addTo(map); else map.removeLayer(trafficLayer); $("trf").classList.toggle("on",on); try{ localStorage.setItem("fwt",on?"1":"0"); }catch(e){} };
  $("trf").onclick=()=>{ on=!on; apply(); }; apply();
  let trOk=0, trErr=0;
  trafficLayer.on("tileload",()=>{ trOk++; });
  trafficLayer.on("tileerror",()=>{ if(trOk===0&&++trErr===4){ on=false; apply(); svcMsg("🚦 Live traffic isn’t loading with this key. Open ⚙️ Settings → Account → 🔧 Check map services to see why."); } });
}
initFirebase();
poiChips(); poiLoad();
idle(); render(); locate(); pull(); setInterval(async()=>{ await pull(); render(); if(nav) navRecheck(); },10000);
</script>
